name: Build signed APK Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Verify permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Set SIGNING_KEYSTORE_BASE64 in repository secrets"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Set SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Set SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Set SIGNING_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dungeon-release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/dungeon-release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build permanently signed APK
        run: |
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DungeonWidget-v0.5.1.apk
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.5.1 >/dev/null 2>&1 && gh release delete v0.5.1 --yes || true
          gh release create v0.5.1 DungeonWidget-v0.5.1.apk --title "Dungeon Widget v0.5.1" --notes "Inventory usability update: live text search, new/favorites/equipped filters, recent loot journal, detailed comparisons in scrollable dialog, smarter class gear selection preserving set bonuses, and mark-new-as-seen. Existing saves preserved."

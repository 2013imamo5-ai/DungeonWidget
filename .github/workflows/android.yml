name: Build APK Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DungeonWidget-v0.1.0.apk
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 >/dev/null 2>&1 && gh release delete v0.1.0 --yes || true
          gh release create v0.1.0 DungeonWidget-v0.1.0.apk --title "Dungeon Widget v0.1.0" --notes "First playable auto-dungeon widget. Debug-signed APK for testing."
